<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الأعمال — الشرقاوي صالون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <script src="/js/brand.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">
        <span class="logo-icon">✂️</span>
        الشرقاوي صالون
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="/" data-i18n="nav_home">الرئيسية</a>
        <a href="/services" data-i18n="nav_services">خدماتنا</a>
        <a href="/gallery" class="active" data-i18n="nav_gallery">معرض الأعمال</a>
        <a href="/book" data-i18n="nav_book">احجز الآن</a>
        <a href="#" data-lang-toggle class="lang-toggle">EN</a>
      </div>
      <div class="navbar-toggle" onclick="toggleNav()">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="page-container" style="max-width:1000px;">

    <a href="/" class="back-link" data-i18n="back_home">→ العودة للرئيسية</a>

    <div class="page-header">
      <h1><span data-i18n="gal_title_1">معرض</span> <span class="text-gold" data-i18n="gal_title_2">الأعمال</span></h1>
      <p data-i18n="gal_sub">شاهد أحدث أعمالنا وتصميماتنا</p>
    </div>

    <div class="gallery-submit-bar">
      <button class="btn btn-outline" onclick="openSubmit()" data-i18n="share_photo">📷 شارك صورتك</button>
    </div>

    <div id="galleryContent">
      <div class="flex-center">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <!-- Customer photo submission modal -->
  <div class="modal-overlay hidden" id="submitModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="share_title">شارك صورتك</h3>
        <button class="btn btn-icon" onclick="closeSubmit()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="text-muted" style="margin-top:0;font-size:0.9rem;" data-i18n="share_note">ستتم مراجعة الصورة قبل نشرها في المعرض.</p>
        <form id="submitForm">
          <div class="form-group">
            <label class="form-label" data-i18n="your_name">اسمك (اختياري)</label>
            <input class="form-input" id="sub-name" maxlength="60" placeholder="اسمك" data-i18n-ph="your_name_ph">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="comment">تعليق (اختياري)</label>
            <input class="form-input" id="sub-desc" maxlength="200" placeholder="مثال: قصة شعر جديدة" data-i18n-ph="comment_ph">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="photo">الصورة</label>
            <input class="form-input" id="sub-file" type="file" accept="image/*" required>
          </div>
          <button type="submit" class="btn btn-gold w-full" id="sub-btn" data-i18n="send_review">إرسال للمراجعة</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-close" onclick="closeLightbox(event)">✕</div>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 <span class="footer-brand">الشرقاوي صالون</span> — <span data-i18n="rights">جميع الحقوق محفوظة</span></p>
  </footer>

  <script src="/js/gallery.js"></script>
  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 40);
    });
    function toggleNav() {
      document.getElementById('navLinks').classList.toggle('open');
    }
  </script>

</body>
</html>
